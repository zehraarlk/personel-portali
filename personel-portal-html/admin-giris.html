<!doctype html>
<html class="light" lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="../images/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personel Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/global.css" />
    <script src="js/tw-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="min-h-screen overflow-x-hidden" data-auth="public" data-route="/admin/giris">
    <div class="login-page login-page--admin">
      <main class="login-box">
        <div class="login-logo-wrap">
          <img class="login-logo" src="https://personel.gebze.bel.tr/public/img/logo/logo1.png" alt="Gebze Belediyesi İnsan Kaynakları" />
        </div>
        <p class="login-badge"><i class="fas fa-shield-halved" aria-hidden="true"></i>YÖNETİM PANELİ</p>
        <p class="login-subtitle">YÖNETİCİ GİRİŞ EKRANI</p>
        <p class="login-note">Yönetim paneli girişi personel girişinden ayrıdır.</p>

        <div id="login-alert" class="login-alert" role="alert" aria-live="polite"></div>

        <form id="login-form" class="login-form" novalidate>
          <div class="login-field">
            <label for="kullanici_adi" class="login-label">
              Kullanıcı Adı <span class="required" aria-hidden="true">*</span>
            </label>
            <input
              id="kullanici_adi"
              type="text"
              class="login-input"
              placeholder="Kullanıcı Adınız..."
              autocomplete="username"
            />
            <p id="kullanici-adi-error" class="login-field-error">Kullanıcı adı boş bırakılamaz.</p>
          </div>

          <div class="login-field">
            <label for="password" class="login-label">
              Şifre <span class="required" aria-hidden="true">*</span>
            </label>
            <div class="login-password-wrap">
              <input
                id="password"
                type="password"
                class="login-input"
                placeholder="Şifreniz"
                autocomplete="current-password"
              />
              <button type="button" id="password-toggle" class="login-password-toggle" aria-label="Şifreyi göster">
                <i id="password-toggle-icon" class="fas fa-eye" aria-hidden="true"></i>
              </button>
            </div>
            <p id="sifre-error" class="login-field-error">Şifre boş bırakılamaz.</p>
          </div>

          <button type="submit" id="login-submit" class="login-submit">GİRİŞ YAP</button>
        </form>

        <a href="giris.html" class="login-back-link"><i class="fas fa-chevron-left" aria-hidden="true"></i>Personel Girişine Dön</a>
      </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session-sync.js"></script>
    <script src="js/session-lifecycle.js"></script>
    <script src="js/site-icons.js"></script>
    <script src="js/auth-bootstrap.js"></script>
    <script src="js/admin-giris.js"></script>
  </body>
</html>
