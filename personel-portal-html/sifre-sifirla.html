<!doctype html>
<html class="light" lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="../images/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personel Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/global.css" />
    <script src="js/tw-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="min-h-screen overflow-x-hidden" data-auth="public" data-route="/sifre-sifirla">
    <div class="login-page login-page--reset">
      <main class="login-box">
        <div class="login-logo-wrap">
          <img class="login-logo" src="https://personel.gebze.bel.tr/public/img/logo/logo1.png" alt="Gebze Belediyesi İnsan Kaynakları" />
        </div>
        <h1 class="login-title">Şifremi Unuttum ?</h1>
        <p class="login-intro">Şifrenizi sıfırlamak için sizden istenilen bilgileri giriniz.</p>

        <div id="reset-alert" class="login-alert" role="alert" aria-live="polite"></div>
        <div id="reset-success" class="login-alert login-alert--success" role="status" aria-live="polite"></div>

        <form id="reset-form" class="login-form" novalidate>
          <div class="login-field">
            <label for="tc_no" class="login-label">
              T.C Kimlik Numarası <span class="required" aria-hidden="true">*</span>
            </label>
            <input
              id="tc_no"
              type="text"
              class="login-input"
              inputmode="numeric"
              maxlength="11"
              placeholder="Kimlik Numaranız..."
              autocomplete="off"
            />
            <p id="tc-no-error" class="login-field-error">Geçerli bir T.C. Kimlik Numarası giriniz.</p>
          </div>

          <div class="login-field">
            <label for="telefon" class="login-label">
              Cep Telefonu <span class="required" aria-hidden="true">*</span>
            </label>
            <input
              id="telefon"
              type="text"
              class="login-input"
              inputmode="numeric"
              maxlength="11"
              placeholder="0**********"
              autocomplete="off"
            />
            <p id="telefon-error" class="login-field-error">Geçerli bir cep telefonu numarası giriniz.</p>
            <p class="login-format-hint">Cep Telefonu Yazım Formatı: <code>05** *** ** **</code></p>
          </div>

          <div class="login-btn-row">
            <button type="submit" id="reset-submit" class="login-submit login-submit--inline">Şifre Sıfırla</button>
            <a href="giris.html" class="login-cancel-btn">Vazgeç</a>
          </div>
        </form>
      </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session-sync.js"></script>
    <script src="js/session-lifecycle.js"></script>
    <script src="js/site-icons.js"></script>
    <script src="js/auth-bootstrap.js"></script>
    <script src="js/sifre-sifirla.js"></script>
  </body>
</html>
