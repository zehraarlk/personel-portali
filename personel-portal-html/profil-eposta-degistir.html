<!doctype html>
<html class="light" lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="../images/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personel Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/global.css" />
    <script src="js/tw-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/media.css" />
    <link rel="stylesheet" href="css/youtube-thumb.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/profil.css" />
  </head>
  <body class="min-h-screen overflow-x-hidden" data-auth="portal" data-route="/profil/eposta-degistir">
    <div class="app-shell flex min-h-dvh flex-col bg-background text-on-background">
      <div id="site-navbar"></div>
      <main class="app-main w-full min-w-0 flex-1 px-3 py-5 sm:px-4 sm:py-6 md:px-8 md:py-8">
        <div class="profil-page">
          <a href="index.html" class="profil-back"><i class="fas fa-arrow-left" aria-hidden="true"></i>Ana sayfa</a>

          <header class="profil-head">
            <span class="profil-head__icon" aria-hidden="true"><i class="fas fa-envelope"></i></span>
            <div class="profil-head__text">
              <h1>E-posta Değiştir</h1>
              <p>Mevcut adres: <strong id="mevcut-email">—</strong></p>
            </div>
          </header>

          <div class="profil-card">
            <form id="email-form" class="profil-form">
              <div class="profil-field">
                <label for="yeni-email">Yeni e-posta</label>
                <input id="yeni-email" type="email" autocomplete="email" required />
              </div>
              <div class="profil-field">
                <label for="email-sifre">Onay için şifre</label>
                <input id="email-sifre" type="password" autocomplete="current-password" required />
                <p class="profil-hint">Değişikliği onaylamak için hesap şifrenizi girin.</p>
              </div>

              <p id="form-err" class="profil-alert profil-alert--error" hidden></p>
              <p id="form-msg" class="profil-alert profil-alert--ok" hidden></p>

              <div class="profil-actions">
                <button type="submit" id="email-submit" class="profil-btn"><i class="fas fa-save" aria-hidden="true"></i>E-postayı Güncelle</button>
              </div>
            </form>
          </div>
        </div>
      </main>
      <div id="site-footer"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session-sync.js"></script>
    <script src="js/session-lifecycle.js"></script>
    <script src="js/site-icons.js"></script>
    <script src="js/media.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/auth-bootstrap.js"></script>
    <script src="js/profil-eposta-degistir.js"></script>
  </body>
</html>
