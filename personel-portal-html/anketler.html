<!doctype html>
<html class="light" lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="../images/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personel Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/global.css" />
    <script src="js/tw-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/media.css" />
    <link rel="stylesheet" href="css/youtube-thumb.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/anketler.css" />
  </head>
  <body class="min-h-screen overflow-x-hidden" data-auth="portal" data-route="/anketler">
    <div class="app-shell flex min-h-dvh flex-col bg-background text-on-background">
      <div id="site-navbar"></div>
      <main class="app-main w-full min-w-0 flex-1 px-3 py-5 sm:px-4 sm:py-6 md:px-8 md:py-8">
        <div class="anketler-page">
          <header class="ak-head">
            <div class="ak-head__left">
              <span class="ak-head__icon" aria-hidden="true"><i data-icon="anketler"></i></span>
              <div>
                <h1>Anketler</h1>
                <p>Kurumsal anketlere katılın, ilerlemeyi takip edin.</p>
              </div>
            </div>
          </header>

          <section class="ak-toolbar" aria-label="Arama ve filtre">
            <form class="ak-search" role="search">
              <label class="ak-search__field" for="anket-search">
                <i data-icon="arama" data-icon-fallback="fas fa-search" aria-hidden="true"></i>
                <input id="anket-search" type="search" placeholder="Anket ara…" autocomplete="off" />
              </label>
              <button type="submit" class="ak-search__btn">Ara</button>
            </form>

            <label class="ak-sort">
              <span class="sr-only">Sıralama</span>
              <select>
                <option value="newest">En Yeni</option>
                <option value="oldest">En Eski</option>
                <option value="popular">Popülerlik</option>
              </select>
            </label>
          </section>

          <nav class="ak-tabs" aria-label="Anket filtreleri"></nav>

          <p class="ak-count"><strong>0</strong> sonuç</p>

          <div class="ak-state">Yükleniyor…</div>
        </div>
      </main>
      <div id="site-footer"></div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session-sync.js"></script>
    <script src="js/session-lifecycle.js"></script>
    <script src="js/site-icons.js"></script>
    <script src="js/media.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/auth-bootstrap.js"></script>
    <script src="js/anketler.js"></script>
  </body>
</html>
