<!doctype html>
<html class="light" lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="../images/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personel Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/global.css" />
    <script src="js/tw-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/media.css" />
    <link rel="stylesheet" href="css/youtube-thumb.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
  </head>
  <body class="min-h-screen overflow-x-hidden" data-auth="portal" data-route="/dogum-gunu">
    <div class="app-shell flex min-h-dvh flex-col bg-background text-on-background">
      <div id="site-navbar"></div>
      <main class="app-main w-full min-w-0 flex-1 px-3 py-5 sm:px-4 sm:py-6 md:px-8 md:py-8">
        <section class="relative overflow-hidden rounded-[24px] border border-[#d8e4e9] bg-[linear-gradient(135deg,#ffffff_0%,#f6f9fa_55%,#edf3f5_100%)] px-5 py-4 shadow-[0_12px_32px_rgba(2,40,66,0.08)] sm:px-6 sm:py-5 lg:px-8 lg:py-5">
          <span class="pointer-events-none absolute right-[42%] top-7 h-2 w-1.5 rotate-[18deg] rounded-sm bg-[#d7a93f] opacity-70"></span>
          <span class="pointer-events-none absolute right-[35%] top-[76px] h-2 w-2 rotate-45 rounded-sm bg-[#89aabb] opacity-70"></span>
          <span class="pointer-events-none absolute right-[29%] top-8 h-1.5 w-1.5 rotate-45 rounded-sm bg-[#d7e5ea]"></span>

          <header class="relative z-10">
            <div class="flex items-center justify-between gap-3">
              <div class="flex min-w-0 items-center gap-2.5">
                <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-[10px] bg-gradient-to-br from-[#174a64] to-[#022842] shadow-[0_6px_14px_rgba(2,40,66,0.18)] sm:h-10 sm:w-10">
                  <i class="fas fa-cake-candles text-[15px] text-white sm:text-[16px]" aria-hidden="true"></i>
                </div>

                <div class="min-w-0">
                  <h1 class="m-0 truncate text-[18px] font-extrabold leading-tight tracking-[-0.02em] text-[#022842] sm:text-[20px]">
                    Doğum Günü Bilgisi
                  </h1>
                  <p class="mt-0.5 text-[12px] font-medium text-[#5c6f7a] sm:text-[13px]">
                    Personelimizin doğum günü listesi
                  </p>
                </div>
              </div>

              <div class="hidden shrink-0 lg:block">
                <svg viewBox="0 0 280 130" class="h-[82px] w-[190px] xl:h-[88px] xl:w-[205px]" aria-hidden="true">
                  <defs>
                    <linearGradient id="heroPanel" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
                      <stop offset="100%" stop-color="#e6eff3" stop-opacity="0.95" />
                    </linearGradient>
                    <linearGradient id="balloonDark" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="#6f95a8" />
                      <stop offset="100%" stop-color="#022842" />
                    </linearGradient>
                    <linearGradient id="balloonLight" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="#dce8ee" />
                      <stop offset="100%" stop-color="#8eafbf" />
                    </linearGradient>
                    <linearGradient id="giftBox" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="#ffffff" />
                      <stop offset="100%" stop-color="#d8e5eb" />
                    </linearGradient>
                    <linearGradient id="cakeBase" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="#d4e1e8" />
                      <stop offset="100%" stop-color="#6d91a4" />
                    </linearGradient>
                    <linearGradient id="cakePlate" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="#edf4f7" />
                      <stop offset="100%" stop-color="#bfd2dc" />
                    </linearGradient>
                    <linearGradient id="flameGlow" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="#ffd978" />
                      <stop offset="100%" stop-color="#f6b534" />
                    </linearGradient>
                    <filter id="heroSoftShadow" x="-30%" y="-30%" width="160%" height="180%">
                      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#022842" flood-opacity="0.12" />
                    </filter>
                    <filter id="heroBlur" x="-50%" y="-50%" width="200%" height="200%">
                      <feGaussianBlur stdDeviation="8" />
                    </filter>
                  </defs>

                  <ellipse cx="160" cy="108" rx="112" ry="10" fill="#022842" opacity="0.08" />
                  <rect x="26" y="16" width="228" height="92" rx="24" fill="url(#heroPanel)" />
                  <path d="M48 30C92 14 168 14 228 28" fill="none" stroke="#9ab2bf" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />

                  <path d="M58 28l11 18H47Z" fill="#d7a93f" opacity="0.95" />
                  <path d="M92 28l11 18H81Z" fill="#87a4b4" opacity="0.95" />
                  <path d="M126 28l11 18H115Z" fill="#022842" opacity="0.95" />
                  <path d="M160 28l11 18H149Z" fill="#d9e7ed" opacity="0.95" />
                  <path d="M194 28l11 18H183Z" fill="#6a8ca0" opacity="0.95" />

                  <circle cx="42" cy="22" r="9" fill="#d7a93f" opacity="0.18" filter="url(#heroBlur)" />
                  <circle cx="242" cy="36" r="10" fill="#8eafbf" opacity="0.2" filter="url(#heroBlur)" />
                  <circle cx="78" cy="96" r="14" fill="#ffffff" opacity="0.55" filter="url(#heroBlur)" />

                  <g transform="translate(44 38)">
                    <path d="M22 29c0 16-11 27-24 27S-26 45-26 29-15 0-2 0s24 13 24 29Z" fill="url(#balloonLight)" />
                    <path d="M56 18c0 17-11 29-25 29S6 35 6 18 17 -10 31 -10s25 11 25 28Z" fill="url(#balloonDark)" />
                    <ellipse cx="-8" cy="18" rx="5" ry="8" fill="#ffffff" opacity="0.3" />
                    <ellipse cx="25" cy="6" rx="5" ry="8" fill="#ffffff" opacity="0.26" />
                    <path d="M-2 56c6 13 3 20 1 29" fill="none" stroke="#6b8ca0" stroke-width="2" stroke-linecap="round" />
                    <path d="M31 47c5 12 1 22 6 34" fill="none" stroke="#315e75" stroke-width="2" stroke-linecap="round" />
                    <path d="M2 58c6 2 9 6 12 11" fill="none" stroke="#9fb6c2" stroke-width="1.6" stroke-linecap="round" />
                  </g>

                  <g filter="url(#heroSoftShadow)" transform="translate(106 57) rotate(-4)">
                    <rect x="0" y="0" width="62" height="42" rx="12" fill="url(#giftBox)" />
                    <rect x="0" y="0" width="62" height="14" rx="10" fill="#f8fbfc" />
                    <rect x="26" y="0" width="10" height="42" rx="4" fill="#022842" opacity="0.92" />
                    <rect x="0" y="11" width="62" height="6" fill="#7d9cad" opacity="0.88" />
                    <path d="M31 2C16 -7 16 -18 25 -16c6 1 8 9 6 18Z" fill="#86a5b4" />
                    <path d="M31 2c15-9 15-20 6-18-6 1-8 9-6 18Z" fill="#5e8193" />
                  </g>

                  <g filter="url(#heroSoftShadow)" transform="translate(170 46)">
                    <ellipse cx="43" cy="63" rx="46" ry="9" fill="#83a0af" opacity="0.18" />
                    <rect x="12" y="52" width="62" height="10" rx="5" fill="url(#cakePlate)" />
                    <rect x="39" y="43" width="8" height="12" rx="4" fill="#adc1cb" />
                    <rect x="0" y="17" width="86" height="37" rx="16" fill="url(#cakeBase)" />
                    <path d="M0 20c0-10 8-18 18-18h50c10 0 18 8 18 18v7c-6 0-6 8-12 8s-6-8-12-8-6 8-13 8-6-8-12-8-6 8-12 8-6-8-12-8S6 35 0 35v-15Z" fill="#ffffff" opacity="0.97" />
                    <g>
                      <rect x="16.5" y="-4" width="5" height="24" rx="2.5" fill="#dce8ed" />
                      <path d="M16.5 1l5 4M16.5 9l5 4" stroke="#688ea2" stroke-width="1.7" />
                      <path d="M19 -7c-5-6-2-12 0-15 4 4 7 10 0 15Z" fill="url(#flameGlow)" />
                    </g>
                    <g>
                      <rect x="40.5" y="-4" width="5" height="24" rx="2.5" fill="#dce8ed" />
                      <path d="M40.5 1l5 4M40.5 9l5 4" stroke="#688ea2" stroke-width="1.7" />
                      <path d="M43 -7c-5-6-2-12 0-15 4 4 7 10 0 15Z" fill="url(#flameGlow)" />
                    </g>
                    <g>
                      <rect x="64.5" y="-4" width="5" height="24" rx="2.5" fill="#dce8ed" />
                      <path d="M64.5 1l5 4M64.5 9l5 4" stroke="#688ea2" stroke-width="1.7" />
                      <path d="M67 -7c-5-6-2-12 0-15 4 4 7 10 0 15Z" fill="url(#flameGlow)" />
                    </g>
                  </g>

                  <g opacity="0.95">
                    <path d="M235 64c7 4 10 11 10 19" fill="none" stroke="#7f9fb0" stroke-width="2.4" stroke-linecap="round" />
                    <path d="M243 60c9 5 14 13 14 24" fill="none" stroke="#9ab3bf" stroke-width="2.2" stroke-linecap="round" />
                    <path d="M231 80c5-1 9 1 14 6" fill="none" stroke="#d7a93f" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
                  </g>

                  <path d="M72 46l2.8 5.6L80 54l-5.2 2.4-2.8 5.6-2.8-5.6L64 54l5.2-2.4Z" fill="#d7a93f" opacity="0.92" />
                  <path d="M205 24l2.2 4.5 4.8 2.1-4.8 2.1-2.2 4.5-2.2-4.5-4.8-2.1 4.8-2.1Z" fill="#7d9cad" opacity="0.92" />
                  <path d="M226 48l1.8 3.6 3.8 1.8-3.8 1.8-1.8 3.6-1.8-3.6-3.8-1.8 3.8-1.8Z" fill="#d7a93f" opacity="0.92" />

                  <circle cx="92" cy="25" r="2.6" fill="#87a4b4" />
                  <circle cx="152" cy="35" r="2.4" fill="#d7a93f" />
                  <circle cx="224" cy="92" r="2.5" fill="#87a4b4" />
                </svg>
              </div>
            </div>

            <div class="mt-4 grid gap-2.5 lg:grid-cols-[auto_minmax(240px,360px)] lg:items-center lg:justify-between">
              <div class="flex flex-wrap gap-1.5" role="tablist" aria-label="Doğum günü kapsamı">
                <button
                  type="button"
                  role="tab"
                  aria-selected="false"
                  class="inline-flex h-8 min-w-[78px] items-center justify-center gap-1.5 rounded-[10px] px-3 text-[12px] font-bold transition duration-200 border border-[#d2dfe5] bg-white/95 text-[#022842] shadow-none hover:border-[#aebfc8] hover:bg-white"
                >
                  <span class="material-symbols-outlined text-[15px] text-[#022842]" aria-hidden="true">calendar_month</span>
                  Bugün
                </button>
                <button
                  type="button"
                  role="tab"
                  aria-selected="true"
                  class="inline-flex h-8 min-w-[78px] items-center justify-center gap-1.5 rounded-[10px] px-3 text-[12px] font-bold transition duration-200 bg-gradient-to-r from-[#174a64] to-[#022842] text-white shadow-[0_5px_12px_rgba(2,40,66,0.2)]"
                >
                  <span class="material-symbols-outlined text-[15px] text-white" aria-hidden="true">calendar_month</span>
                  Bu Ay
                </button>
              </div>
              <div class="flex h-8 w-full items-center rounded-[10px] border border-[#c7d7de] bg-white/95 px-3 shadow-[0_2px_8px_rgba(2,40,66,0.04)] focus-within:border-[#7f9faf] focus-within:ring-2 focus-within:ring-[#dbe8ed]">
                <button
                  type="button"
                  class="mr-1.5 flex shrink-0 items-center text-[#7a8b94] hover:text-[#022842]"
                  aria-label="Arama kutusuna odaklan"
                >
                  <span class="material-symbols-outlined text-[17px]" aria-hidden="true">search</span>
                </button>

                <input
                  type="search"
                  placeholder="İsim veya soyisim ile ara..."
                  class="h-full w-full border-0 bg-transparent text-[12px] font-medium text-[#022842] outline-none placeholder:font-normal placeholder:text-[#8b9aa2]"
                />
              </div>
            </div>
          </header>

          <main class="relative z-10 mt-5"></main>
        </section>
      </main>
      <div id="site-footer"></div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session-sync.js"></script>
    <script src="js/session-lifecycle.js"></script>
    <script src="js/site-icons.js"></script>
    <script src="js/media.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/auth-bootstrap.js"></script>
    <script src="js/dogum-gunu.js"></script>
  </body>
</html>
