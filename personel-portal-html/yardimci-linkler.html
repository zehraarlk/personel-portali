<!doctype html>
<html class="light" lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="../images/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personel Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/global.css" />
    <script src="js/tw-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/media.css" />
    <link rel="stylesheet" href="css/youtube-thumb.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/etkinlikler.css" />
    <link rel="stylesheet" href="css/protokoller.css" />
  </head>
  <body class="min-h-screen overflow-x-hidden" data-auth="portal" data-route="/yardimci-linkler">
    <div class="app-shell flex min-h-dvh flex-col bg-background text-on-background">
      <div id="site-navbar"></div>
      <main class="app-main w-full min-w-0 flex-1 px-3 py-5 sm:px-4 sm:py-6 md:px-8 md:py-8">
        <style>
        .yl-kategoriler-panel {
          background: #ffffff;
          border: 1px solid rgba(0,0,0,0.08);
          border-radius: 12px;
          overflow: hidden;
          isolation: isolate;
        }
        .yl-kategoriler-baslik {
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 14px 16px;
          cursor: pointer;
          user-select: none;
          background: #fff;
        }
        .yl-kategoriler-baslik i {
          color: #1c3a5e;
          font-size: 16px;
          width: 18px;
          text-align: center;
        }
        .yl-kategoriler-baslik span {
          font-size: 14px;
          font-weight: 500;
          color: #222;
        }
        .yl-kategori-satir {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          width: 100%;
          box-sizing: border-box;
          text-align: left;
          padding: 13px 16px;
          border: none;
          border-top: 1px solid rgba(0,0,0,0.07);
          background: #fff;
          color: #333;
          font-size: 13.5px;
          font-weight: 500;
          cursor: pointer;
          transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        .yl-kategori-satir:hover {
          background: rgba(28,58,94,0.05);
        }
        .yl-kategori-satir.acik {
          background: #fdf1dc;
          border-top-color: #f5a623;
          color: #1a1a1a;
          font-weight: 600;
        }
        .yl-kategori-satir.acik + .yl-kategori-satir {
          border-top-color: #f5a623;
        }
        .yl-kategori-sag {
          display: flex;
          align-items: center;
          gap: 8px;
          flex-shrink: 0;
        }
        .yl-kategori-badge {
          font-size: 11px;
          font-weight: 500;
          padding: 2px 8px;
          border-radius: 999px;
          background: rgba(0,0,0,0.06);
          color: #666;
        }
        .yl-kategori-satir.acik .yl-kategori-badge {
          background: #f5a623;
          color: #fff;
        }
        .yl-kategori-satir .yl-kategori-chevron {
          font-size: 12px;
          color: #b5b5ae;
        }
        .yl-section {
          background: #ffffff;
          border: 1px solid rgba(0,0,0,0.08);
          border-radius: 14px;
          overflow: hidden;
        }
        .yl-section-head {
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 18px 20px;
        }
        .yl-section-icon {
          width: 44px;
          height: 44px;
          border-radius: 10px;
          background: #1c3a5e;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }
        .yl-section-icon i {
          color: #f5a623;
          font-size: 18px;
        }
        .yl-section-title {
          font-size: 17px;
          font-weight: 500;
          color: #1a1a1a;
          margin: 0;
        }
        .yl-section-sub {
          font-size: 12.5px;
          color: #777;
          margin: 2px 0 0;
        }
        .yl-section-badge {
          font-size: 12.5px;
          font-weight: 500;
          color: #444;
          background: rgba(0,0,0,0.05);
          border-radius: 999px;
          padding: 5px 14px;
          white-space: nowrap;
          margin-left: auto;
        }
        .yl-section-body {
          padding: 4px 20px 22px;
          border-top: 1px solid rgba(0,0,0,0.06);
        }
        .yl-card {
          text-decoration: none;
          display: flex;
          flex-direction: column;
          align-items: center;
          border: 1px solid rgba(0,0,0,0.10);
          border-radius: 14px;
          background: #e2e8f0;
          padding: 14px 12px 12px;
          position: relative;
          transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
          justify-content: center;
        }
        .yl-card:hover {
          transform: translateY(-3px);
          box-shadow: 0 10px 24px rgba(28, 58, 94, 0.14);
          border-color: rgba(28, 58, 94, 0.35);
        }
        .yl-card-ext {
          position: absolute;
          top: 10px;
          right: 10px;
          width: 24px;
          height: 24px;
          border-radius: 7px;
          border: 1px solid rgba(0,0,0,0.12);
          background: #fff;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #9a9a95;
          font-size: 10px;
          transition: color 0.15s ease, border-color 0.15s ease;
        }
        .yl-card:hover .yl-card-ext {
          color: #1c3a5e;
          border-color: rgba(28,58,94,0.35);
        }
        .yl-card-logo {
          width: 90%;
          aspect-ratio: 1 / 1;
          border-radius: 10px;
          background: #ffffff;
          border: 1px solid rgba(0,0,0,0.08);
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          margin-bottom: 10px;
        }
        .yl-card-logo img {
          max-width: 70%;
          max-height: 70%;
          object-fit: contain;
        }
        .yl-card-title {
          font-size: 13px;
          font-weight: 500;
          color: #222;
          text-align: center;
          margin: 0;
          line-height: 1.3;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }
        </style>

        <div class="etkinlikler-page" style="min-height: 85vh; padding-bottom: 40px;">
          <header class="etkinlikler-head">
            <div class="etkinlikler-head-left">
              <span class="etkinlikler-head-icon">
                <i class="fas fa-link" aria-hidden="true"></i>
              </span>
              <div>
                <h1>Yardımcı Linkler</h1>
                <p>Sık kullanılan kurumsal sistemlere ve bağlantılara buradan ulaşın.</p>
              </div>
            </div>
          </header>

          <div style="display: flex; align-items: center; gap: 8px; margin: 20px 0 28px;">
            <div style="position: relative; width: 500px;">
              <i class="fas fa-magnifying-glass" aria-hidden="true" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9a9a95; font-size: 14px;"></i>
              <input
                type="search"
                placeholder="Link adı ara…"
                autocomplete="off"
                style="width: 100%; box-sizing: border-box; padding: 10px 12px 10px 38px; border-radius: 10px; background: #fff; border: 1px solid rgba(0,0,0,0.12); color: #222; height: 40px;"
              />
            </div>

            <div style="margin-left: auto; position: relative;">
              <button
                type="button"
                aria-expanded="false"
                style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: 0.5px solid rgba(0,0,0,0.18); background: #fff; color: #222; font-size: 14px; font-weight: 500; cursor: pointer;"
              >
                <i class="fas fa-bars" aria-hidden="true" style="color: #1c3a5e;"></i>
                Kategoriler
              </button>
            </div>
          </div>
        </div>
      </main>
      <div id="site-footer"></div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session-sync.js"></script>
    <script src="js/session-lifecycle.js"></script>
    <script src="js/site-icons.js"></script>
    <script src="js/media.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/auth-bootstrap.js"></script>
    <script src="js/yardimci-linkler.js"></script>
  </body>
</html>
