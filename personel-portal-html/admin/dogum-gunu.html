<!doctype html>
<html class="light" lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="../../images/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personel Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/global.css" />
    <script src="js/tw-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="min-h-screen overflow-x-hidden" data-auth="admin" data-route="/admin/dogum-gunu" data-title="Doğum Günü Bilgisi">
    <div id="admin-root" class="admin-layout admin-body">
      <main class="admin-content">
        <div class="admin-module">
          <header class="admin-page-head">
            <div class="admin-page-head__text">
              <h2><i class="fas fa-birthday-cake" aria-hidden="true"></i>Doğum Günü Bilgisi</h2>
            </div>
            <div class="admin-page-head__actions">
              <span class="admin-count-pill">Bugün <strong>0</strong></span>
              <a href="personeller-ekle.html" class="admin-btn admin-btn-primary"><i class="fas fa-user-plus" aria-hidden="true"></i> Yeni Personel</a>
            </div>
          </header>
          <div class="admin-dg-toolbar">
            <label class="admin-dg-toolbar__filter" for="dg-scope-filter">
              <span class="admin-yl-toolbar__label"><i class="fas fa-filter" aria-hidden="true"></i>Filtre</span>
              <select id="dg-scope-filter" class="admin-toolbar-select" aria-label="Doğum günü filtresi">
                <option value="today">Bugün</option>
                <option value="month">Bu ay</option>
                <option value="all">Tümü</option>
              </select>
            </label>
            <a href="personeller.html" class="admin-btn admin-btn-secondary admin-btn-sm"><i class="fas fa-users" aria-hidden="true"></i> Personeller</a>
          </div>
          <div class="admin-card admin-card--flush">
            <div class="admin-table-wrap">
              <table class="admin-table admin-table--crud">
                <thead>
                  <tr>
                    <th>Foto</th>
                    <th>Ad Soyad</th>
                    <th>Sicil</th>
                    <th>E-posta</th>
                    <th>Doğum Tarihi</th>
                    <th>İşlem</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="6" class="admin-empty">Yükleniyor…</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/session-sync.js"></script>
    <script src="../js/session-lifecycle.js"></script>
    <script src="../js/site-icons.js"></script>
    <script src="../js/media.js"></script>
    <script src="../js/auth-bootstrap.js"></script>
    <script src="js/admin-config.js"></script>
    <script src="js/admin-api.js"></script>
    <script src="js/form-rules.js"></script>
    <script src="js/admin-widgets.js"></script>
    <script src="js/admin-layout.js"></script>
    <script src="js/dogum-gunu.js"></script>
  </body>
</html>
