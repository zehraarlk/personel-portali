<!doctype html>
<html class="light" lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="../../images/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personel Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/global.css" />
    <script src="js/tw-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="min-h-screen overflow-x-hidden" data-auth="admin" data-route="/admin/vefat/ekle" data-title="Yeni Vefat Kaydı">
    <div id="admin-root" class="admin-layout admin-body">
      <main class="admin-content">
        <div class="admin-module">
          <header class="admin-page-head">
            <div class="admin-page-head__text">
              <h2><i class="fas fa-ribbon" aria-hidden="true"></i>Yeni vefat kaydı</h2>
            </div>
            <div class="admin-page-head__actions">
              <a href="vefat.html" class="admin-btn admin-btn-secondary"><i class="fas fa-arrow-left" aria-hidden="true"></i> Listeye dön</a>
            </div>
          </header>
          <div class="admin-crud-form-shell">
            <div class="admin-card">
              <div class="admin-card-body">
                <form class="admin-form admin-form--vefat">
                  <label>Vefat eden adı *<input required /></label>
                  <label>İlişki / pozisyon<input /></label>
                  <div class="admin-form__row-2">
                    <label>Vefat tarihi *<input type="date" required /></label>
                    <label>Tarih metni<input placeholder="örn: 21 Aralık 2024" maxlength="50" /></label>
                  </div>
                  <label>Cenaze mesajı *<textarea rows="5" required></textarea></label>
                  <div class="admin-form__actions">
                    <button type="submit" class="admin-btn admin-btn-primary">Kaydet</button>
                    <a href="vefat.html" class="admin-btn admin-btn-secondary">İptal</a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/session-sync.js"></script>
    <script src="../js/session-lifecycle.js"></script>
    <script src="../js/site-icons.js"></script>
    <script src="../js/media.js"></script>
    <script src="../js/auth-bootstrap.js"></script>
    <script src="js/admin-config.js"></script>
    <script src="js/admin-api.js"></script>
    <script src="js/form-rules.js"></script>
    <script src="js/admin-widgets.js"></script>
    <script src="js/admin-layout.js"></script>
    <script src="js/vefat-ekle.js"></script>
  </body>
</html>
