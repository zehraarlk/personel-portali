<!doctype html>
<html class="light" lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="../../images/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personel Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/global.css" />
    <script src="js/tw-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="min-h-screen overflow-x-hidden" data-auth="admin" data-route="/admin/profil/sifre-degistir" data-title="Şifre Değiştir">
    <div id="admin-root" class="admin-layout admin-body">
      <main class="admin-content">
        <div class="admin-card">
          <div class="admin-card-header">
            <h2><i class="fas fa-key" aria-hidden="true"></i> Şifre değiştir</h2>
            <a href="index.html" class="admin-btn admin-btn-secondary admin-btn-sm">Dashboard</a>
          </div>
          <div class="admin-card-body">
            <form class="admin-form" id="change-password-form">
              <label>
                Mevcut şifre
                <input type="password" name="mevcut" required />
              </label>
              <label>
                Yeni şifre
                <input type="password" name="yeni" required minlength="6" />
              </label>
              <label>
                Yeni şifre (tekrar)
                <input type="password" name="tekrar" required minlength="6" />
              </label>
              <div class="admin-form__actions">
                <button type="submit" class="admin-btn admin-btn-primary">Güncelle</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/session-sync.js"></script>
    <script src="../js/session-lifecycle.js"></script>
    <script src="../js/site-icons.js"></script>
    <script src="../js/media.js"></script>
    <script src="../js/auth-bootstrap.js"></script>
    <script src="js/admin-config.js"></script>
    <script src="js/admin-api.js"></script>
    <script src="js/form-rules.js"></script>
    <script src="js/admin-widgets.js"></script>
    <script src="js/admin-layout.js"></script>
    <script src="js/profil-sifre-degistir.js"></script>
  </body>
</html>
