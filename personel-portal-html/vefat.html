<!doctype html>
<html class="light" lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="../images/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personel Portalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/global.css" />
    <script src="js/tw-theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/media.css" />
    <link rel="stylesheet" href="css/youtube-thumb.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
  </head>
  <body class="min-h-screen overflow-x-hidden" data-auth="portal" data-route="/vefat">
    <div class="app-shell flex min-h-dvh flex-col bg-background text-on-background">
      <div id="site-navbar"></div>
      <main class="app-main w-full min-w-0 flex-1 px-3 py-5 sm:px-4 sm:py-6 md:px-8 md:py-8">
        <div class="w-full">
          <div class="mb-4 flex items-center gap-3">
            <span
              class="flex h-[42px] w-[42px] shrink-0 items-center justify-center rounded-xl"
              style="background: #022842; box-shadow: 0 4px 12px rgba(2, 40, 66, 0.18);"
            >
              <i class="fas fa-ribbon text-[17px] text-white" aria-hidden="true"></i>
            </span>
            <div>
              <h1 class="m-0 text-[22px] font-extrabold leading-tight tracking-tight text-[#022842]">
                Vefat Edenler
              </h1>
              <p class="m-0 text-[13px] text-[#5b6b78]">
                Personelimizin ve yakınlarının vefat duyuruları
              </p>
            </div>
          </div>

          <div class="mb-6 grid grid-cols-1 gap-5 sm:grid-cols-2">
            <div class="flex h-[42px] items-center gap-2 rounded-xl border border-[#022842]/10 bg-white px-3.5 shadow-sm">
              <button type="button" class="flex items-center" aria-label="Arama kutusuna odaklan">
                <span class="material-symbols-outlined text-[17px] text-[#9aa5ad]">search</span>
              </button>
              <input
                type="text"
                placeholder="İsim veya soyisim ile ara…"
                class="w-full border-0 bg-transparent text-sm text-[#0b1c30] outline-none placeholder:text-[#9aa5ad]"
              />
            </div>

            <div class="flex items-center justify-end">
              <div class="flex h-[42px] w-fit items-center gap-2 rounded-xl border border-[#022842]/10 bg-white px-3.5 shadow-sm">
                <button type="button" class="flex items-center" aria-label="Yıl menüsünü aç">
                  <span class="material-symbols-outlined text-[17px] text-[#9aa5ad]">calendar_month</span>
                </button>
                <select class="border-0 bg-transparent text-sm font-semibold text-[#022842] outline-none">
                  <option value="tumu">Tüm Yıllar</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </main>
      <div id="site-footer"></div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/api.js"></script>
    <script src="js/session-sync.js"></script>
    <script src="js/session-lifecycle.js"></script>
    <script src="js/site-icons.js"></script>
    <script src="js/media.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/auth-bootstrap.js"></script>
    <script src="js/vefat.js"></script>
  </body>
</html>
